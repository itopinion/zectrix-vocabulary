[package]
name = "zectrix-vocabulary"
version = "0.2.0"
edition = "2021"
license = "MIT"
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
csv = "1"
[profile.release]
strip = true
